name: djigarlar
description: Djigarlar - messenger (Android)
publish_to: none
version: 0.6.2+8

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  flutter_webrtc: ^0.12.0
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  record: ^5.1.2
  audioplayers: ^6.1.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  adaptive_icon_background: "assets/logo_bg.png"
  adaptive_icon_foreground: "assets/logo_fg.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
